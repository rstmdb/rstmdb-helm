# Default values for rstmdb.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the chart
fullnameOverride: ""

image:
  # -- Image registry
  registry: ""
  # -- Image repository
  repository: rstmdb/rstmdb
  # -- Image tag (defaults to Chart appVersion)
  tag: ""
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Number of pods in the StatefulSet.
# When `replication.enabled=true`, pod-0 is the PRIMARY (accepts writes) and
# pods 1..N-1 are REPLICAS (read-only, stream the WAL from the primary). Set
# this to `1 + desired replicas` (e.g. 3 = 1 primary + 2 replicas). With
# replication disabled, each pod is an independent standalone server.
replicaCount: 1

# Replication configuration.
# Turns the StatefulSet into a primary/replica cluster: the ordinal-0 pod runs
# as primary and the rest as replicas that connect to it over the headless
# service. Requires `replicaCount >= 2` to actually have a replica.
replication:
  # -- Enable primary/replica replication
  enabled: false
  # -- Replication mode: "async" (writes ack locally) or "sync" (writes wait
  # for replica ACKs before returning to the client)
  mode: async
  # Sync-mode settings (ignored when mode=async)
  sync:
    # -- Number of replica ACKs required before a write is acknowledged
    replicas: 1
    # -- Timeout (ms) to wait for the required ACKs before failing the write
    timeoutMs: 5000
  # Replication authentication. When enabled, a shared token secures the
  # primary<->replica stream (the primary accepts it, replicas present it).
  # NOTE: this is independent of client `auth` — but if client auth is on, the
  # server also requires replication auth, so enable this too.
  auth:
    # -- Secure the replication stream with a shared token
    enabled: false
    # -- Shared plaintext token (primary accepts it; replicas present it).
    # Ignored if `existingSecret` is set.
    token: ""
    # -- Use an existing secret instead of `token` (expects key `replication-token`)
    existingSecret: ""
  # -- Tailer poll interval (ms). Empty = server default.
  pollIntervalMs: ""
  # -- Heartbeat interval (seconds). Empty = server default.
  heartbeatIntervalSecs: ""
  # -- Create a separate read-only Service (`<fullname>-read`) load-balancing
  # across all pods for read scale-out (writes must still go to the primary).
  readService: true

# Network configuration
network:
  # -- Bind address for RCP server
  bindAddr: "0.0.0.0:7401"
  # -- Idle connection timeout in seconds
  idleTimeoutSecs: 300
  # -- Maximum number of connections
  maxConnections: 1000

# Storage configuration
storage:
  # -- Data directory path inside container
  dataDir: /data
  # -- WAL segment size in megabytes
  walSegmentSizeMb: 64
  # -- Fsync policy: every_write, every_n:<n>, every_ms:<ms>, never
  fsyncPolicy: every_write
  # Persistence configuration
  persistence:
    # -- Enable persistent storage
    enabled: true
    # -- Storage class (empty uses default)
    storageClass: ""
    # -- Size of the persistent volume
    size: 10Gi
    # -- Access modes for the persistent volume
    accessModes:
      - ReadWriteOnce

# Authentication configuration
auth:
  # -- Require authentication
  required: false
  # -- List of token hashes (SHA-256)
  tokenHashes: []
  # -- Use existing secret for auth tokens (key: tokens.secret)
  existingSecret: ""

# TLS configuration
tls:
  # -- Enable TLS
  enabled: false
  # -- Use existing secret for TLS (keys: tls.crt, tls.key, ca.crt)
  existingSecret: ""
  # -- Require client certificate
  requireClientCert: false
  # -- TLS certificate (PEM format)
  cert: ""
  # -- TLS private key (PEM format)
  key: ""
  # -- CA certificate for client verification (PEM format)
  caCert: ""

# Compaction configuration
compaction:
  # -- Enable compaction
  enabled: true
  # -- Trigger compaction after this many events
  eventsThreshold: 10000
  # -- Trigger compaction after this size in MB
  sizeThresholdMb: 100
  # -- Minimum interval between compactions in seconds
  minIntervalSecs: 60

# Metrics configuration
metrics:
  # -- Enable Prometheus metrics endpoint
  enabled: true
  # -- Bind address for metrics server
  bindAddr: "0.0.0.0:9090"
  # ServiceMonitor configuration
  serviceMonitor:
    # -- Create ServiceMonitor for Prometheus Operator
    enabled: false
    # -- Additional labels for ServiceMonitor
    labels: {}
    # -- Scrape interval
    interval: 30s
    # -- Scrape timeout
    scrapeTimeout: 10s
    # -- Namespace for ServiceMonitor (defaults to release namespace)
    namespace: ""

# Service configuration
service:
  # -- Service type
  type: ClusterIP
  # -- RCP service port
  port: 7401
  # -- Node port (only if type is NodePort)
  nodePort: ""
  # -- Load balancer IP (only if type is LoadBalancer)
  loadBalancerIP: ""
  # -- Additional annotations
  annotations: {}

# Resource limits and requests
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# Security context for the pod
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Security context for the container
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Pod Disruption Budget
podDisruptionBudget:
  # -- Enable PodDisruptionBudget
  enabled: true
  # -- Minimum available pods
  minAvailable: 1
  # -- Maximum unavailable pods (alternative to minAvailable)
  # maxUnavailable: 1

# Network Policy
networkPolicy:
  # -- Enable NetworkPolicy
  enabled: false
  # -- Allow ingress from these pod selectors
  allowFrom: []
  # -- Allow ingress from these namespace selectors
  allowFromNamespaces: []

# Ingress configuration (for metrics endpoint)
ingress:
  # -- Enable Ingress
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Additional annotations
  annotations: {}
  # -- Ingress hosts
  hosts:
    - host: rstmdb-metrics.local
      paths:
        - path: /
          pathType: Prefix
  # -- TLS configuration
  tls: []

# Logging configuration
logging:
  # -- Log level: trace, debug, info, warn, error
  level: info

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Additional pod annotations
podAnnotations: {}

# Additional pod labels
podLabels: {}

# Liveness probe configuration
livenessProbe:
  httpGet:
    path: /health
    port: metrics
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness probe configuration
readinessProbe:
  httpGet:
    path: /healthz
    port: metrics
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Service Account
serviceAccount:
  # -- Create service account
  create: true
  # -- Service account annotations
  annotations: {}
  # -- Service account name (auto-generated if not set)
  name: ""

# Extra environment variables
extraEnv: []

# Extra volume mounts
extraVolumeMounts: []

# Extra volumes
extraVolumes: []

# rstmdb Studio - Web UI
studio:
  # -- Enable rstmdb Studio deployment
  enabled: false

  image:
    # -- Studio image registry
    registry: ""
    # -- Studio image repository
    repository: rstmdb/rstmdb-studio
    # -- Studio image tag
    tag: ""
    # -- Studio image pull policy
    pullPolicy: IfNotPresent

  # -- Number of Studio replicas
  replicaCount: 1

  # Admin user initialization
  init:
    # -- Create admin user via init container
    enabled: true
    # -- Admin username
    username: admin
    # -- Admin password (change in production!)
    password: admin
    # -- Use existing secret for admin credentials (keys: username, password)
    existingSecret: ""

  # Service configuration
  service:
    # -- Studio service type
    type: ClusterIP
    # -- Studio service port
    port: 8080
    # -- Node port (only if type is NodePort)
    nodePort: ""
    # -- Additional annotations
    annotations: {}

  # Ingress configuration
  ingress:
    # -- Enable Studio Ingress
    enabled: false
    # -- Ingress class name
    className: ""
    # -- Additional annotations
    annotations: {}
    # -- Ingress hosts
    hosts:
      - host: studio.rstmdb.local
        paths:
          - path: /
            pathType: Prefix
    # -- TLS configuration
    tls: []

  # Resource limits and requests
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Security context for the studio container
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

  # -- Additional pod annotations
  podAnnotations: {}

  # -- Additional pod labels
  podLabels: {}

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

  # -- Extra environment variables
  extraEnv: []
