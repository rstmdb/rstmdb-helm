{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rstmdb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rstmdb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rstmdb.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from pods within the same namespace by default
    - from:
        - podSelector: {}
      ports:
        - port: 7401
          protocol: TCP
        {{- if .Values.metrics.enabled }}
        - port: 9090
          protocol: TCP
        {{- end }}
    {{- if .Values.networkPolicy.allowFrom }}
    # Allow traffic from specified pod selectors
    - from:
        {{- range .Values.networkPolicy.allowFrom }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - port: 7401
          protocol: TCP
        {{- if .Values.metrics.enabled }}
        - port: 9090
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- if .Values.networkPolicy.allowFromNamespaces }}
    # Allow traffic from specified namespaces
    - from:
        {{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - port: 7401
          protocol: TCP
        {{- if .Values.metrics.enabled }}
        - port: 9090
          protocol: TCP
        {{- end }}
    {{- end }}
{{- end }}
