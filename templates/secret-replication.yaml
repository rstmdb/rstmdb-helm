{{- if and .Values.replication.enabled .Values.replication.auth.enabled (not .Values.replication.auth.existingSecret) }}
{{- if not .Values.replication.auth.token }}
{{- fail "replication.auth.enabled=true requires either replication.auth.token or replication.auth.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rstmdb.replicationAuthSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rstmdb.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Shared replication token: the primary accepts it (hashing it internally) and
  # replicas present it when connecting. The same value is used on every pod.
  replication-token: {{ .Values.replication.auth.token | quote }}
{{- end }}
