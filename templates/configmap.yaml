apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rstmdb.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rstmdb.labels" . | nindent 4 }}
data:
  config.yaml: |
    network:
      bind_addr: {{ .Values.network.bindAddr | quote }}
      idle_timeout_secs: {{ .Values.network.idleTimeoutSecs }}
      max_connections: {{ .Values.network.maxConnections }}

    storage:
      data_dir: {{ .Values.storage.dataDir | quote }}
      wal_segment_size_mb: {{ .Values.storage.walSegmentSizeMb }}
      fsync_policy: {{ include "rstmdb.fsyncPolicy" . | quote }}

    {{- if .Values.auth.required }}
    auth:
      required: true
      {{- if or .Values.auth.tokenHashes .Values.auth.existingSecret }}
      token_hashes_file: /etc/rstmdb/secrets/tokens.secret
      {{- end }}
    {{- else }}
    auth:
      required: false
    {{- end }}

    {{- if .Values.tls.enabled }}
    tls:
      enabled: true
      cert_file: /etc/rstmdb/tls/tls.crt
      key_file: /etc/rstmdb/tls/tls.key
      {{- if .Values.tls.requireClientCert }}
      require_client_cert: true
      ca_file: /etc/rstmdb/tls/ca.crt
      {{- end }}
    {{- end }}

    compaction:
      enabled: {{ .Values.compaction.enabled }}
      {{- if .Values.compaction.enabled }}
      events_threshold: {{ .Values.compaction.eventsThreshold }}
      size_threshold_mb: {{ .Values.compaction.sizeThresholdMb }}
      min_interval_secs: {{ .Values.compaction.minIntervalSecs }}
      {{- end }}

    metrics:
      enabled: {{ .Values.metrics.enabled }}
      {{- if .Values.metrics.enabled }}
      bind_addr: {{ .Values.metrics.bindAddr | quote }}
      {{- end }}

    logging:
      level: {{ .Values.logging.level | quote }}
