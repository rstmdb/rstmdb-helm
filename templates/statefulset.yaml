apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rstmdb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rstmdb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "rstmdb.headlessServiceName" . }}
  selector:
    matchLabels:
      {{- include "rstmdb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and .Values.auth.required (not .Values.auth.existingSecret) .Values.auth.tokenHashes }}
        checksum/auth: {{ include (print $.Template.BasePath "/secret-auth.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.replication.enabled .Values.replication.auth.enabled (not .Values.replication.auth.existingSecret) }}
        checksum/replication: {{ include (print $.Template.BasePath "/secret-replication.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "rstmdb.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rstmdb.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "rstmdb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.replication.enabled }}
          # Replication role is derived from the StatefulSet ordinal: pod-0 is
          # the primary, all others are replicas that stream from it. The base
          # config comes from the ConfigMap; role/upstream are injected here as
          # env overrides (applied on top of the config file by the server).
          command:
            - /bin/sh
            - -c
            - |
              set -e
              ORDINAL="${HOSTNAME##*-}"
              if [ "$ORDINAL" = "0" ]; then
                export RSTMDB_REPL_ROLE=primary
                echo "rstmdb: starting as PRIMARY (ordinal $ORDINAL)"
              else
                export RSTMDB_REPL_ROLE=replica
                export RSTMDB_REPL_UPSTREAM="{{ include "rstmdb.replicationUpstream" . }}"
                echo "rstmdb: starting as REPLICA (ordinal $ORDINAL) upstream=$RSTMDB_REPL_UPSTREAM"
              fi
              exec rstmdb
          {{- end }}
          env:
            - name: RSTMDB_CONFIG
              value: /etc/rstmdb/config.yaml
            {{- if .Values.replication.enabled }}
            - name: RSTMDB_REPL_MODE
              value: {{ .Values.replication.mode | quote }}
            {{- if eq .Values.replication.mode "sync" }}
            - name: RSTMDB_REPL_SYNC_REPLICAS
              value: {{ .Values.replication.sync.replicas | quote }}
            - name: RSTMDB_REPL_SYNC_TIMEOUT_MS
              value: {{ .Values.replication.sync.timeoutMs | quote }}
            {{- end }}
            {{- if .Values.replication.auth.enabled }}
            - name: RSTMDB_REPL_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "rstmdb.replicationAuthSecretName" . }}
                  key: replication-token
            {{- end }}
            {{- with .Values.replication.pollIntervalMs }}
            - name: RSTMDB_REPL_POLL_INTERVAL_MS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.replication.heartbeatIntervalSecs }}
            - name: RSTMDB_REPL_HEARTBEAT_INTERVAL_SECS
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: rcp
              containerPort: 7401
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: 9090
              protocol: TCP
            {{- end }}
          {{- if .Values.metrics.enabled }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/rstmdb
              readOnly: true
            - name: data
              mountPath: {{ .Values.storage.dataDir }}
            {{- if and .Values.auth.required (or .Values.auth.tokenHashes .Values.auth.existingSecret) }}
            - name: auth-secret
              mountPath: /etc/rstmdb/secrets
              readOnly: true
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: tls-secret
              mountPath: /etc/rstmdb/tls
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "rstmdb.configMapName" . }}
        {{- if and .Values.auth.required (or .Values.auth.tokenHashes .Values.auth.existingSecret) }}
        - name: auth-secret
          secret:
            secretName: {{ include "rstmdb.authSecretName" . }}
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls-secret
          secret:
            secretName: {{ include "rstmdb.tlsSecretName" . }}
        {{- end }}
        {{- if not .Values.storage.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.storage.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "rstmdb.labels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.storage.persistence.accessModes | nindent 10 }}
        {{- if .Values.storage.persistence.storageClass }}
        storageClassName: {{ .Values.storage.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.persistence.size }}
  {{- end }}
