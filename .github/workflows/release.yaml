name: Release Chart

on:
  push:
    branches:
      - main
    paths:
      - 'Chart.yaml'
      - 'values.yaml'
      - 'templates/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  release:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Get chart version
        id: chart
        run: |
          echo "version=$(grep '^version:' Chart.yaml | awk '{print $2}')" >> $GITHUB_OUTPUT
          echo "name=$(grep '^name:' Chart.yaml | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Check if release exists
        id: check_release
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Package chart
        if: steps.check_release.outputs.exists == 'false'
        run: helm package .

      - name: Prepare Pages site
        if: steps.check_release.outputs.exists == 'false'
        run: |
          mkdir -p site

          # Fetch existing index and packages from gh-pages if it exists
          if git ls-remote --heads origin | grep -q "refs/heads/gh-pages"; then
            git fetch origin gh-pages
            git checkout origin/gh-pages -- . 2>/dev/null || true
            # Move any existing .tgz and index.yaml into site/
            cp *.tgz site/ 2>/dev/null || true
            cp index.yaml site/ 2>/dev/null || true
            git checkout main -- . 2>/dev/null || true
          fi

          # Copy new package
          cp ${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}.tgz site/

          # Rebuild index
          helm repo index site/ --url https://charts.rstmdb.com

      - name: Upload Pages artifact
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        if: steps.check_release.outputs.exists == 'false'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}
          name: ${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}
          files: ${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
