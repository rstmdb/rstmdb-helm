# Production values for rstmdb.
# This file provides recommended settings for production deployments.

replicaCount: 3

image:
  repository: rstmdb/rstmdb
  tag: latest
  pullPolicy: Always

network:
  bindAddr: "0.0.0.0:7401"
  idleTimeoutSecs: 300
  maxConnections: 5000

storage:
  dataDir: /data
  walSegmentSizeMb: 64
  fsyncPolicy: every_write
  persistence:
    enabled: true
    storageClass: "fast-ssd"  # Use appropriate storage class for your cluster
    size: 50Gi

auth:
  required: true
  # Generate token hashes with: echo -n "your-secret-token" | sha256sum
  tokenHashes:
    - "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
  # Or use an existing secret:
  # existingSecret: "rstmdb-auth-secret"

tls:
  enabled: true
  existingSecret: "rstmdb-tls-secret"
  requireClientCert: false

compaction:
  enabled: true
  eventsThreshold: 50000
  sizeThresholdMb: 500
  minIntervalSecs: 300

metrics:
  enabled: true
  bindAddr: "0.0.0.0:9090"
  serviceMonitor:
    enabled: false
    interval: 15s
    scrapeTimeout: 10s

service:
  type: ClusterIP
  port: 7401

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podDisruptionBudget:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true

logging:
  level: info

# Anti-affinity to spread pods across nodes
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rstmdb
          topologyKey: kubernetes.io/hostname

# Tolerations for dedicated nodes (adjust as needed)
tolerations: []

nodeSelector: {}

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"
